<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tableros Datos DICEI</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f2f3f7;
      --surface: #ffffff;
      --surface2: #eaecf5;
      --border: rgba(80,100,180,0.10);
      --border-hover: rgba(80,100,180,0.25);
      --accent: #3b6ff0;
      --accent2: #7c5cfc;
      --text: #1a1f36;
      --muted: #7a85a3;
      --error: #e53e3e;
    }

    html {
      height: 100%;
    }
    body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-y: auto;
    }



    #login-screen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .35s ease, transform .35s ease;
    }

    #login-screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-18px);
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 44px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(59,111,240,0.08);
    }

    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: .18em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 10px;
    }
    .login-logo h1 { font-family: 'DM Serif Display', serif; font-size: 24px; font-weight: 400; color: var(--text); }

    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 12px; font-weight: 500; color: var(--muted);
      margin-bottom: 6px; letter-spacing: .04em; text-transform: uppercase;
    }
    .form-group input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      border-radius: 10px; background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border-color .2s;
    }
    .form-group input:focus { border-color: var(--accent); }

    .error-msg { font-size: 13px; color: var(--error); text-align: center; margin-bottom: 14px; min-height: 18px; }

    .login-btn {
      width: 100%; padding: 12px; background: var(--accent); color: white;
      border: none; border-radius: 10px; font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: background .2s, transform .1s;
    }
    .login-btn:hover { background: #2d5fd4; }
    .login-btn:active { transform: scale(.98); }
    .login-btn:disabled { background: var(--muted); cursor: not-allowed; }

    #menu {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px 20px 40px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(18px);
      transition: opacity .35s ease, transform .35s ease;
    }
    #menu.visible {
      display: flex;
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }
    #menu.hidden {
      display: none;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-18px);
    }

    @media (max-width: 600px) {
      .cards { flex-direction: column; align-items: center; }
      .card { width: 90vw; max-width: 340px; }
      .menu-header h1 { font-size: 24px; }
      .menu-header { margin-bottom: 32px; }
    }

    .menu-header { text-align: center; margin-bottom: 52px; }
    .menu-header .eyebrow {
      font-size: 11px; font-weight: 600; letter-spacing: .18em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 12px;
    }
    .menu-header h1 { font-family: 'DM Serif Display', serif; font-size: clamp(26px, 4vw, 40px); font-weight: 400; color: var(--text); }
    .menu-header p { margin-top: 10px; font-size: 14px; color: var(--muted); font-weight: 300; }

    .logout-btn {
      position: fixed; top: 18px; right: 20px;
      background: none; border: 1px solid var(--border); border-radius: 8px;
      color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 12px;
      padding: 5px 12px; cursor: pointer; transition: border-color .2s, color .2s;
    }
    .logout-btn:hover { border-color: var(--border-hover); color: var(--text); }

    .cards { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }

    .card {
      width: 340px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; overflow: hidden; cursor: pointer;
      transition: border-color .25s, transform .25s, box-shadow .25s;
    }
    .card:hover { border-color: var(--border-hover); transform: translateY(-5px); box-shadow: 0 20px 48px rgba(59,111,240,0.10); }

    .card-preview {
      width: 100%; height: 190px; display: flex; align-items: center;
      justify-content: center; position: relative; overflow: hidden;
    }
    .card:nth-child(1) .card-preview { background: linear-gradient(135deg, #dce8ff 0%, #eef3ff 100%); }
    .card:nth-child(2) .card-preview { background: linear-gradient(135deg, #e4dcff 0%, #f0eeff 100%); }

    .card-preview::before {
      content: ''; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(80,100,200,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(80,100,200,0.07) 1px, transparent 1px);
      background-size: 26px 26px;
    }

    .preview-icon { position: relative; z-index: 1; width: 62px; height: 62px; border-radius: 14px; display: flex; align-items: center; justify-content: center; }
    .card:nth-child(1) .preview-icon { background: rgba(59,111,240,0.12); border: 1px solid rgba(59,111,240,0.20); }
    .card:nth-child(2) .preview-icon { background: rgba(124,92,252,0.12); border: 1px solid rgba(124,92,252,0.20); }
    .preview-icon svg { width: 28px; height: 28px; }
    .card:nth-child(1) .preview-icon svg { color: #3b6ff0; }
    .card:nth-child(2) .preview-icon svg { color: #7c5cfc; }

    .mini-bars { position: absolute; bottom: 18px; left: 20px; right: 20px; display: flex; align-items: flex-end; gap: 5px; height: 38px; z-index: 1; opacity: .30; }
    .mini-bar { flex: 1; border-radius: 3px 3px 0 0; }
    .card:nth-child(1) .mini-bar { background: #3b6ff0; }
    .card:nth-child(2) .mini-bar { background: #7c5cfc; }

    .card-body { padding: 20px 22px 22px; border-top: 1px solid var(--border); }
    .card-tag { font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
    .card:nth-child(1) .card-tag { color: #3b6ff0; }
    .card:nth-child(2) .card-tag { color: #7c5cfc; }
    .card-title { font-size: 16px; font-weight: 500; margin-bottom: 6px; line-height: 1.3; color: var(--text); }
    .card-desc { font-size: 13px; color: var(--muted); font-weight: 300; line-height: 1.5; }
    .card-arrow { margin-top: 16px; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
    .card:nth-child(1) .card-arrow { color: #3b6ff0; }
    .card:nth-child(2) .card-arrow { color: #7c5cfc; }
    .card-arrow svg { width: 14px; height: 14px; transition: transform .2s; }
    .card:hover .card-arrow svg { transform: translateX(3px); }

    #viewer {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      background: var(--bg); opacity: 0; pointer-events: none; transform: translateY(18px);
      transition: opacity .35s ease, transform .35s ease;
    }
    #viewer.visible { opacity: 1; pointer-events: all; transform: translateY(0); }

    .viewer-bar {
      height: 50px; min-height: 50px; background: var(--surface);
      border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 16px;
    }
    .back-btn {
      background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted);
      font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 5px 13px 5px 9px;
      cursor: pointer; display: flex; align-items: center; gap: 6px; transition: border-color .2s, color .2s;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .back-btn svg { width: 14px; height: 14px; }
    .viewer-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    #viewer-title { font-size: 13px; font-weight: 500; color: var(--muted); }
    #dashboard-frame { flex: 1; width: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box">
      <div class="login-logo">
        <div class="eyebrow">DICEI · Datos</div>
        <h1>Tableros Datos Dicei</h1>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email-input" placeholder="usuario@ejemplo.com" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password-input" placeholder="••••••••" />
      </div>
      <div class="error-msg" id="error-msg"></div>
      <button class="login-btn" id="login-btn" onclick="doLogin()">Ingresar</button>
    </div>
  </div>

  <div id="menu">
    <button class="logout-btn" onclick="doLogout()">Cerrar sesión</button>
    <div class="menu-header">
      <div class="eyebrow">DICEI · Datos</div>
      <h1>Tableros Datos Dicei</h1>
      <p>Seleccioná un tablero para continuar</p>
    </div>
    <div class="cards" id="cards-container">
      <!-- Las cards se generan dinámicamente después del login -->
    </div>
  </div>

  <div id="viewer">
    <div class="viewer-bar">
      <button class="back-btn" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Volver al menú
      </button>
      <div class="viewer-dot" id="viewer-dot"></div>
      <span id="viewer-title"></span>
    </div>
    <iframe id="dashboard-frame" allowfullscreen></iframe>
  </div>

  <script>
    const loginScreen = document.getElementById('login-screen');
    const menu        = document.getElementById('menu');
    const viewer      = document.getElementById('viewer');
    const frame       = document.getElementById('dashboard-frame');
    const vtitle      = document.getElementById('viewer-title');
    const vdot        = document.getElementById('viewer-dot');
    const errorMsg    = document.getElementById('error-msg');
    const loginBtn    = document.getElementById('login-btn');
    const cardsContainer = document.getElementById('cards-container');

    let dashboards = [];

    const icons = [
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>`,
      `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-6"/></svg>`
    ];

    const descs = [
      "Cobertura del Calendario Nacional de Vacunación por vacuna, provincia y semana.",
      "Seguimiento de la campaña antigripal: cobertura, avance y distribución por región."
    ];

    const barHeights = [
      ["55%","80%","45%","95%","65%","70%","50%","85%"],
      ["40%","60%","75%","55%","90%","70%","85%","100%"]
    ];

    document.getElementById('password-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email    = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      errorMsg.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Ingresando...';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = 'Email o contraseña incorrectos';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Ingresar';
          return;
        }

        sessionStorage.setItem('auth_token', data.access_token);
        await loadDashboards(data.access_token);

      } catch (err) {
        errorMsg.textContent = 'Error de conexión, intentá de nuevo';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Ingresar';
      }
    }

    async function loadDashboards(token) {
      try {
        const res = await fetch('/api/dashboards', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await res.json();

        if (!res.ok) {
          doLogout();
          return;
        }

        dashboards = data.dashboards;
        renderCards();
        loginScreen.classList.add('hidden');
        menu.classList.add('visible');

      } catch (err) {
        errorMsg.textContent = 'Error al cargar los tableros';
        loginBtn.disabled = false;
        loginBtn.textContent = 'Ingresar';
      }
    }

    function renderCards() {
      cardsContainer.innerHTML = '';
      dashboards.forEach((d, i) => {
        const bars = barHeights[i].map(h => `<div class="mini-bar" style="height:${h}"></div>`).join('');
        cardsContainer.innerHTML += `
          <div class="card" onclick="openDashboard(${i})">
            <div class="card-preview">
              <div class="preview-icon">${icons[i]}</div>
              <div class="mini-bars">${bars}</div>
            </div>
            <div class="card-body">
              <div class="card-tag">Tablero ${i + 1}</div>
              <div class="card-title">${d.title}</div>
              <div class="card-desc">${descs[i]}</div>
              <div class="card-arrow">
                Ver tablero
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </div>
            </div>
          </div>`;
      });
    }

    function doLogout() {
      sessionStorage.removeItem('auth_token');
      dashboards = [];
      cardsContainer.innerHTML = '';
      frame.src = '';
      menu.classList.remove('visible');
      viewer.classList.remove('visible');
      loginScreen.classList.remove('hidden');
      document.getElementById('email-input').value = '';
      document.getElementById('password-input').value = '';
      errorMsg.textContent = '';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Ingresar';
    }

    function openDashboard(i) {
      const d = dashboards[i];
      frame.src = d.url;
      vtitle.textContent = d.title;
      vdot.style.background = d.color;
      menu.classList.add('hidden');
      viewer.classList.add('visible');
    }

    function goBack() {
      viewer.classList.remove('visible');
      menu.classList.remove('hidden');
      setTimeout(() => { frame.src = ''; }, 400);
    }

    // Si hay sesión activa, cargar directo
    const savedToken = sessionStorage.getItem('auth_token');
    if (savedToken) {
      loginScreen.classList.add('hidden');
      loadDashboards(savedToken).then(() => {
        menu.classList.add('visible');
      });
    }
  </script>

</body>
</html>
